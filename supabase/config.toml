# Per-function JWT settings. Without an entry here the CLI deploys a function with
# verify_jwt ON, which silently breaks anything whose caller cannot send a Supabase
# token. Two of ours cannot: pg_cron posts to the dispatcher with only x-cron-secret,
# and Twilio posts to the webhook with only X-Twilio-Signature. Both authenticate
# inside the function body, so the entries below must stay false.

[functions.dispatch-scheduled-messages]
verify_jwt = false

[functions.run-booking-automations]
verify_jwt = false

[functions.twilio-inbound-sms]
verify_jwt = false

[functions.enqueue-review-asks]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

# Make's email connector calls this with only x-webhook-secret (EMAIL_PARSE_SECRET,
# checked inside the function), never a Supabase token. It was deployed with the
# gateway check ON on 2026-09-07 18:13 UTC and every email parse answered 401 until
# the next day; bookings still arrived through the Xano echo, so nothing was lost.
[functions.email-booking-parse]
verify_jwt = false

# Xano sends only x-webhook-secret, never a Supabase token.
[functions.xano-booking-sync]
verify_jwt = false

# The Xano mirror worker (docs/xano-mirror.md): pg_cron with x-cron-secret.
[functions.xano-mirror-dispatch]
verify_jwt = false
[functions.whatsapp-send]
verify_jwt = true

[functions.whatsapp-templates]
verify_jwt = true

[functions.sms-send]
verify_jwt = true

[functions.sms-sync]
verify_jwt = true

[functions.gp-slots]
verify_jwt = true

[functions.gp-validate]
verify_jwt = true

# Called only by gp-validate, server to server with the service key.
[functions.gp-voucher-vision]
verify_jwt = true

[functions.gp-book]
verify_jwt = true

# Kiosk card flow v2 (docs/kiosk-card-flow-v2.md). The tablet sends only the anon key,
# like the other kiosk functions; kiosk-sale-sweep is pg_cron with x-cron-secret.
[functions.kiosk-config]
verify_jwt = false

[functions.kiosk-sale-start]
verify_jwt = false

[functions.kiosk-sale-complete]
verify_jwt = false

[functions.kiosk-sale-sweep]
verify_jwt = false

[functions.kiosk-log]
verify_jwt = false

# Employee PIN check (docs/kiosk-employees.md). Public like the other kiosk functions.
[functions.kiosk-pin-verify]
verify_jwt = false

# The two original kiosk writers, now in the repo (they gained employee attribution).
[functions.kiosk-cash-sale]
verify_jwt = false

[functions.kiosk-booking-update]
verify_jwt = false

[functions.kiosk-booking]
verify_jwt = false
